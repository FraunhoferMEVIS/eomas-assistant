[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "eomas-assistant"
version = "0.1.0"
description = "Extensible LangGraph multi-agent earth observability assistant starter"
readme = "README.md"
license = { text = "BSD-3-Clause-Clear" }
requires-python = ">=3.11,<3.13"
dependencies = [
  "langgraph>=1.1.0",
  "langchain",
  "langchain-core>=0.3.37",
  "langchain-ollama>=1.0.0",
  "langchain-openai>=1.0.0",
  "streamlit>=1.42.0",
  "folium>=0.17.0",
  "streamlit-folium>=0.23.0",
  "pydantic>=2.10.6",
  "pydantic-settings>=2.8.1",
  "httpx>=0.28.1",
  "python-dotenv>=1.0.1",
  "pandas>=2.2.3",
  "pillow>=10.4.0",
  "tenacity>=9.0.0",
  "rasterio[s3]>=1.4.4",
  "pystac-client>=0.9.0",
  "pyproj==3.6.1",
  "boto3-stubs~=1.42.77",
  "titiler.application>=0.24.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "ruff>=0.9.7",
  "mypy>=1.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term --cov-report=xml --cov-report=html"
markers = [
  "integration: tests that call real external services (LLM/geocoding)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = ["src"]
